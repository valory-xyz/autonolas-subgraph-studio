  # ---- Aerodrome Slipstream (CL) positions ---------------------------------
  - kind: ethereum
    name: VeloNFTManager
    network: base
    source:
      address: "0xe1f8cd9AC4e4A65F54f38a5CdAfCA44f6dD68b53" # Aerodrome Slipstream NFPM
      abi: VelodromePositionNFTManager
      startBlock: 47163056
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolPosition
      abis:
        - name: VelodromePositionNFTManager
          file: ../../../abis/nft/VelodromePositionNFTManager.json
        - name: VelodromeCLPool
          file: ../../../abis/defi/VelodromeCLPool.json
        - name: VelodromeCLFactory
          file: ../../../abis/defi/VelodromeCLFactory.json
        - name: VeloCLGauge
          file: ../../../abis/defi/VeloCLGauge.json
        - name: AeroCLGauge
          file: ../../../abis/defi/AeroCLGauge.json
        - name: VelodromeV2Pool
          file: ../../../abis/defi/VelodromeV2Pool.json
        - name: AggregatorV3Interface
          file: ../../../abis/oracles/AggregatorV3Interface.json
      eventHandlers:
        - event: IncreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleIncreaseLiquidity
        - event: DecreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleDecreaseLiquidity
        - event: Collect(indexed uint256,address,uint256,uint256)
          handler: handleCollect
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleNFTTransfer
      file: ./src/veloNFTManager.ts

  # ---- Aero CL positions ----------------------------------------------------
  # Same handlers as the Slipstream NFPM above, except IncreaseLiquidity, which on
  # the Aero NFPM carries two extra tick arguments. The shared refresh binds the
  # NFPM through VelodromePositionNFTManager (identical positions() layout).
  - kind: ethereum
    name: AeroNFTManager
    network: base
    source:
      address: "0x4857DB576eE0e45F10525eC59527BfD10beeC60b" # Aero NFPM
      abi: AeroPositionNFTManager
      startBlock: 52881675 # NFPM deployment (2026-10-21)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProtocolPosition
      abis:
        - name: AeroPositionNFTManager
          file: ../../../abis/nft/AeroPositionNFTManager.json
        - name: VelodromePositionNFTManager
          file: ../../../abis/nft/VelodromePositionNFTManager.json
        - name: VelodromeCLPool
          file: ../../../abis/defi/VelodromeCLPool.json
        - name: VelodromeCLFactory
          file: ../../../abis/defi/VelodromeCLFactory.json
        - name: VeloCLGauge
          file: ../../../abis/defi/VeloCLGauge.json
        - name: AeroCLGauge
          file: ../../../abis/defi/AeroCLGauge.json
        - name: VelodromeV2Pool
          file: ../../../abis/defi/VelodromeV2Pool.json
        - name: AggregatorV3Interface
          file: ../../../abis/oracles/AggregatorV3Interface.json
      eventHandlers:
        - event: IncreaseLiquidity(indexed uint256,uint128,uint256,uint256,int24,int24)
          handler: handleAeroIncreaseLiquidity
        - event: DecreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleDecreaseLiquidity
        - event: Collect(indexed uint256,address,uint256,uint256)
          handler: handleCollect
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleNFTTransfer
      file: ./src/veloNFTManager.ts

  # ---- Aerodrome v2 pool discovery / bootstrap (Sugar) ----------------------
  - kind: ethereum/contract
    name: VeloV2Sugar
    network: base
    source:
      address: "0x69dD9db6d8f8E7d83887A704f447b1a584b599A1" # Aerodrome LpSugar v3
      abi: Sugar
      startBlock: 47163056
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/veloV2Bootstrap.ts
      entities:
        - ProtocolPosition
      abis:
        - name: Sugar
          # Aerodrome LpSugar v3 — its `all` takes 3 args and returns a different
          # struct than Velodrome's; we use `forSwaps(limit, offset)` which returns
          # exactly {lp, type, token0, token1, ...}. Base-specific ABI (not the shared
          # Velodrome Sugar.json, which babydegen-optimism still uses).
          file: ../../../abis/utils/AerodromeLpSugar.json
        - name: PoolFactory
          file: ../../../abis/defi/PoolFactory.json
        - name: VelodromeV2Pool
          file: ../../../abis/defi/VelodromeV2Pool.json
      blockHandlers:
        - handler: handleVeloV2Bootstrap
          filter:
            kind: once

  - kind: ethereum/contract
    name: VeloV2Factory
    network: base
    source:
      address: "0x420DD381b31aEf6683db6B902084cB0FFECe40Da" # Aerodrome v2 PoolFactory (Divya-confirmed)
      abi: PoolFactory
      startBlock: 47163056
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/veloV2Bootstrap.ts
      entities:
        - ProtocolPosition
      abis:
        - name: PoolFactory
          file: ../../../abis/defi/PoolFactory.json
        - name: VelodromeV2Pool
          file: ../../../abis/defi/VelodromeV2Pool.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed bool,address,uint256)
          handler: handleVeloV2PoolCreated

  # ---- Aero v2 pools + gauges ------------------------------------------------
  # Aero's v2 factories emit PoolCreated without the indexed `stable` flag, so they
  # get their own ABI. GaugeCreated feeds the AeroGauge map (resolveV2Gauge).
  - kind: ethereum/contract
    name: AeroV2StableFactory
    network: base
    source:
