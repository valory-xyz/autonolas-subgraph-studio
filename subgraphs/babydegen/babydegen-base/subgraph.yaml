          file: ../../../abis/nft/VelodromePositionNFTManager.json
        - name: AggregatorV3Interface
          file: ../../../abis/oracles/AggregatorV3Interface.json
        - name: ERC20
          file: ../../../abis/ERC20.json
        - name: VeloCLGauge
          file: ../../../abis/defi/VeloCLGauge.json
        - name: AeroCLGauge
          file: ../../../abis/defi/AeroCLGauge.json
        # The snapshot block handler refreshes every active position
        # (refreshAllActivePositions). For staked V2 positions that calls
        # refreshVeloV2Position → Voter.gauges() + gauge.balanceOf/earned, so
        # the V2 gauge/voter ABIs must be declared here too (not just on the
        # VeloV2Pool template).
        - name: VeloVoter
          file: ../../../abis/defi/VeloVoter.json
        - name: VeloV2Gauge
          file: ../../../abis/defi/VeloV2Gauge.json
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            # Base ~2s blocks; 1800 ≈ 1h. Confirmed (Divya): snapshots only fire on
            # UTC-midnight crossings, so a finer interval wouldn't add snapshots.
            every: 1800
      file: ./src/portfolioScheduler.ts

