type InstanceCreated @entity(immutable: true) {
  id: Bytes!
  sender: Bytes! # address
  instance: Bytes! # address
  implementation: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type InstanceRemoved @entity(immutable: true) {
  id: Bytes!
  instance: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type InstanceStatusChanged @entity(immutable: true) {
  id: Bytes!
  instance: Bytes! # address
  isEnabled: Boolean! # bool
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type OwnerUpdated @entity(immutable: true) {
  id: Bytes!
  owner: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type VerifierUpdated @entity(immutable: true) {
  id: Bytes!
  verifier: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Checkpoint @entity(immutable: true) {
  isRebaseline: Boolean

  id: Bytes!
  epoch: BigInt! # uint256
  availableRewards: BigInt! # uint256
  serviceIds: [BigInt!]! # uint256[]
  rewards: [BigInt!]! # uint256[]
  epochLength: BigInt! # uint256
  blockNumber: BigInt!
  transactionHash: Bytes!
  blockTimestamp: BigInt!
  contractAddress: Bytes! # address
}

type Deposit @entity(immutable: true) {
  id: Bytes!
  sender: Bytes! # address
  amount: BigInt! # uint256
  balance: BigInt! # uint256
  availableRewards: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RewardClaimed @entity(immutable: true) {
  receivers: [Bytes!]
  rewardAmounts: [BigInt!]

  id: Bytes!
  epoch: BigInt! # uint256
  serviceId: BigInt! # uint256
  owner: Bytes! # address
  multisig: Bytes! # address
  nonces: [BigInt!]! # uint256[]
  reward: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServiceForceUnstaked @entity(immutable: true) {
  id: Bytes!
  epoch: BigInt! # uint256
  serviceId: BigInt! # uint256
  owner: Bytes! # address
  multisig: Bytes! # address
  nonces: [BigInt!]! # uint256[]
  reward: BigInt! # uint256
  availableRewards: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServiceInactivityWarning @entity(immutable: true) {
  id: Bytes!
  epoch: BigInt! # uint256
  serviceId: BigInt! # uint256
  serviceInactivity: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServiceStaked @entity(immutable: true) {
  rewardDistributionInfo: BigInt

  id: Bytes!
  epoch: BigInt! # uint256
  serviceId: BigInt! # uint256
  owner: Bytes! # address
  multisig: Bytes! # address
  nonces: [BigInt!]! # uint256[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServiceUnstaked @entity(immutable: true) {
  id: Bytes!
  epoch: BigInt! # uint256
  serviceId: BigInt! # uint256
  owner: Bytes! # address
  multisig: Bytes! # address
  nonces: [BigInt!]! # uint256[]
  reward: BigInt! # uint256
  availableRewards: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServicesEvicted @entity(immutable: true) {
  id: Bytes!
  epoch: BigInt! # uint256
  serviceIds: [BigInt!]! # uint256[]
  owners: [Bytes!]! # address[]
  multisigs: [Bytes!]! # address[]
  serviceInactivity: [BigInt!]! # uint256[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Withdraw @entity(immutable: true) {
  id: Bytes!
  to: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type StakingContract @entity(immutable: true) {
  id: Bytes! # instance address
  sender: Bytes! # address
  instance: Bytes! # address
  implementation: Bytes! # address
  # Nullable below: implementations expose different getters
  stakingManager: Bytes
  stakingToken: Bytes
  serviceRegistryTokenUtility: Bytes
  version: String
  configComplete: Boolean! # false when a getter reverted and the field holds a default
  isOlasStaking: Boolean! # stakingToken matches this network's OLAS
  eventsIndexed: Boolean! # false when the implementation's events do not match the manifest
  metadataHash: Bytes!
  maxNumServices: BigInt!
  rewardsPerSecond: BigInt!
  minStakingDeposit: BigInt!
  minStakingDuration: BigInt!
  maxNumInactivityPeriods: BigInt!
  livenessPeriod: BigInt!
  timeForEmissions: BigInt!
  numAgentInstances: BigInt!
  agentIds: [BigInt!]!
  threshold: BigInt!
  configHash: Bytes!
  proxyHash: Bytes!
  serviceRegistry: Bytes!
  activityChecker: Bytes!
}

type RewardUpdate @entity(immutable: true) {
  id: ID!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  type: String! # "Claimable" or "Claimed"
  amount: BigInt!
}

type Service @entity(immutable: false) {
  id: ID!
  currentOlasStaked: BigInt!
  currentStakeAmount: BigInt! # recorded on stake, subtracted on unstake
  hasOlasStake: Boolean! # has staked in an OLAS contract at least once
  olasRewardsEarned: BigInt!
  olasRewardsClaimed: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  global: Global!
  latestStakingContract: Bytes
  totalEpochsParticipated: Int!
  rewardsHistory: [ServiceRewardsHistory!]! @derivedFrom(field: "service")
}

type ServiceRewardsHistory @entity(immutable: false) {
  isRebaseline: Boolean

  id: ID! # {serviceId}-{contractAddress}-{epoch}
  service: Service!
  epoch: BigInt!
  contractAddress: Bytes!
  checkpoint: Checkpoint
  rewardAmount: BigInt!
  checkpointedAt: BigInt
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ActiveServiceEpoch @entity(immutable: false) {
  id: ID! # {contractAddress}-{epoch}
  contractAddress: Bytes!
  epoch: BigInt!
  activeServiceIds: [BigInt!]!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

type Global @entity(immutable: false) {
  id: ID!
  cumulativeOlasStaked: BigInt!
  cumulativeOlasUnstaked: BigInt!
  currentOlasStaked: BigInt!
  totalRewards: BigInt! # cumulative rewards earned
  totalRewardsClaimed: BigInt! # cumulative rewards paid out
  lastActiveDayTimestamp: BigInt!
  services: [Service!]! @derivedFrom(field: "global")
}

type CumulativeDailyStakingGlobal @entity(immutable: false) {
  id: Bytes!
  timestamp: BigInt!
  block: BigInt!
  totalRewards: BigInt!
  totalRewardsClaimed: BigInt!
  numServices: Int!
  medianCumulativeRewards: BigInt!
}
# v0.4 has no reward amount on unstake; payouts are recorded only by RewardClaimed.
type ServiceUnstakedV4 @entity(immutable: true) {
  id: Bytes!
  epoch: BigInt!
  serviceId: BigInt!
  owner: Bytes!
  multisig: Bytes!
  nonces: [BigInt!]!
  availableRewards: BigInt!
  enforced: Boolean!
  contractAddress: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# One baseline per contract/epoch, correlated with the immediately following Checkpoint.
type ServicesRebaselined @entity(immutable: true) {
  id: ID!
  epoch: BigInt!
  contractAddress: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServiceBaselineEvent @entity(immutable: true) {
  id: Bytes!
  epoch: BigInt!
  serviceId: BigInt!
  kind: String! # Missing or Recovered
  contractAddress: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Service baseline status is scoped to the instance, not only the service ID.
type ServiceBaselineState @entity(immutable: false) {
  id: ID!
  serviceId: BigInt!
  contractAddress: Bytes!
  baselineMissing: Boolean!
  epoch: BigInt!
}
